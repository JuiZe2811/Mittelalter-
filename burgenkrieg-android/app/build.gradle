plugins {
    id 'com.android.application'
}
android {
    namespace 'de.burgenkrieg.app'
    compileSdk 34
    defaultConfig {
        applicationId 'de.burgenkrieg.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
